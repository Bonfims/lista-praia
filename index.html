<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f766e">
<title>Lista da praia</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2428; --mute:#68737a; --line:#e4e0d6;
  --acc:#0f766e; --acc-ink:#ffffff; --acc-soft:#dff1ee; --warn:#b45309; --warn-soft:#fdf0dc; --add:#4f46e5; --add-soft:#e9e8fd;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1416; --card:#162023; --ink:#e8eeef; --mute:#8b9aa0; --line:#26343a;
    --acc:#2dd4bf; --acc-ink:#06201c; --acc-soft:#12342f; --warn:#f2b45a; --warn-soft:#33260f; --add:#a5a0ff; --add-soft:#25234a;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1416; --card:#162023; --ink:#e8eeef; --mute:#8b9aa0; --line:#26343a;
  --acc:#2dd4bf; --acc-ink:#06201c; --acc-soft:#12342f; --warn:#f2b45a; --warn-soft:#33260f; --add:#a5a0ff; --add-soft:#25234a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- login ---------- */
#lock{min-height:100dvh;display:grid;place-items:center;padding:16px}
#lock form{width:min(100%,360px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px}
#lock h1{margin:0 0 4px;font-size:20px}
#lock p{margin:0 0 18px;color:var(--mute);font-size:14px}
#lock input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
#lock input:focus{outline:2px solid var(--acc);outline-offset:1px}
#lock .go{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--acc-ink);font-weight:650;cursor:pointer}
#lock .go:disabled{opacity:.6;cursor:wait}
#lock .err{min-height:20px;margin-top:10px;color:var(--warn);font-size:14px}

/* ---------- app ---------- */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.wrap{max-width:1100px;margin:0 auto}
.row1{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
h1.title{margin:0;font-size:20px;line-height:1.2}
.sub{margin:2px 0 0;color:var(--mute);font-size:13px}
.out{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--mute);font-size:13px;cursor:pointer;white-space:nowrap}
.prog{margin:10px 0 8px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;transition:width .25s}
.prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--mute);font-size:14px;font-weight:550}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
#q{flex:1;min-width:140px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
#q:focus{outline:2px solid var(--acc);outline-offset:1px}

main{padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
#list{columns:1;column-gap:16px}
@media (min-width:760px){#list{columns:2}}
@media (min-width:1080px){#list{columns:3}}
section.sec{break-inside:avoid;margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
section.sec>button.head{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;font-weight:700}
section.sec>button.head:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.head .n{margin-left:auto;font-weight:500;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.head .chev{width:10px;height:10px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .15s;margin-right:2px}
section.sec.closed .chev{transform:rotate(-45deg)}
section.sec.closed ul{display:none}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li.it{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
li.it:last-child{border-bottom:0}
li.it.static{cursor:default}
.box{flex:none;width:24px;height:24px;margin-top:1px;border:2px solid var(--mute);border-radius:7px;display:grid;place-items:center;color:transparent;transition:.12s}
li.done .box{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mute);margin:9px 8px 0 8px;opacity:.6}
.body{flex:1;min-width:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.nt{display:block;margin-top:2px;color:var(--mute);font-size:13px;line-height:1.35}
.qt{flex:none;max-width:42%;text-align:right;font-weight:650;font-size:14px;font-variant-numeric:tabular-nums;color:var(--acc)}
li.done .nm{text-decoration:line-through;color:var(--mute);font-weight:500}
li.done .qt{color:var(--mute);font-weight:500}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:650;vertical-align:1px}
.tag.add{background:var(--add-soft);color:var(--add)}
.tag.opt{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:4px}
@media print{header.top .tools,.out{display:none}section.sec.closed ul{display:block}}
</style>
</head>
<body>

<div id="lock">
  <form id="lf" autocomplete="off">
    <h1>Lista da praia</h1>
    <p>Acesso protegido. Digite a senha para ver a lista.</p>
    <input id="pw" type="password" placeholder="senha" autocomplete="off" spellcheck="false" autofocus aria-label="Senha">
    <button class="go" id="go" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <div class="row1">
      <div><h1 class="title" id="title"></h1><p class="sub" id="sub"></p></div>
      <button class="out" id="out" type="button">Sair</button>
    </div>
    <div class="prog"><div class="bar" aria-hidden="true"><i id="barf"></i></div><span id="progt"></span></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Filtro">
        <button type="button" data-f="falta" aria-pressed="true">Falta</button>
        <button type="button" data-f="comprado" aria-pressed="false">Comprado</button>
        <button type="button" data-f="tudo" aria-pressed="false">Tudo</button>
      </div>
      <input id="q" type="search" placeholder="Buscar item" aria-label="Buscar item">
    </div>
  </div></header>
  <main><div class="wrap"><div id="list"></div></div></main>
</div>

<script>
(() => {
  const E = window.__ENC__, $ = id => document.getElementById(id);
  const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let DATA = null, filtro = 'falta', busca = '';
  const closed = {};            // estado aberto/fechado das seções
  let checks = {};
  const KEY = 'lista-praia:checks';
  try { checks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { checks = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(checks)); } catch (e) {} };

  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

  // ---------- login ----------
  if (!(window.crypto && crypto.subtle)) {
    $('err').textContent = 'Este navegador não liberou a criptografia. Abra o link por https.';
    $('go').disabled = true;
  }
  $('lf').addEventListener('submit', async ev => {
    ev.preventDefault();
    const pw = $('pw').value; if (!pw) return;
    $('go').disabled = true; $('err').textContent = 'Verificando…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(E.salt), iterations: E.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(E.iv) }, key, un(E.ct));
      DATA = JSON.parse(new TextDecoder().decode(buf));
    } catch (e) {
      $('err').textContent = 'Senha incorreta.'; $('go').disabled = false; $('pw').select(); return;
    }
    $('pw').value = '';
    $('lock').hidden = true; $('app').hidden = false;
    start();
  });

  // ---------- app ----------
  const contavel = (s, it) => !s.info && it.tipo !== 'opt';
  function start() {
    document.title = DATA.titulo;
    $('title').textContent = DATA.titulo;
    $('sub').textContent = DATA.sub || '';
    DATA.secoes.forEach((s, i) => { closed[i] = !!s.recolhida; });
    document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
      filtro = b.dataset.f;
      document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      render();
    }));
    $('q').addEventListener('input', e => { busca = norm(e.target.value.trim()); render(); });
    $('out').addEventListener('click', () => location.reload());
    render();
  }

  function visivel(s, it) {
    if (busca && !norm(it.nome + ' ' + (it.nota || '')).includes(busca)) return false;
    if (s.info) return filtro !== 'comprado';
    if (filtro === 'tudo') return true;
    const done = !!checks[it.id];
    return filtro === 'comprado' ? done : !done;
  }

  function render() {
    const list = $('list'); list.textContent = '';
    let total = 0, feitos = 0, mostrados = 0;
    DATA.secoes.forEach(s => s.itens.forEach(it => { if (contavel(s, it)) { total++; if (checks[it.id]) feitos++; } }));
    $('progt').replaceChildren(el('b', null, feitos + ' de ' + total), document.createTextNode(' comprados'));
    $('barf').style.width = (total ? feitos / total * 100 : 0) + '%';

    DATA.secoes.forEach((s, si) => {
      const itens = s.itens.filter(it => visivel(s, it));
      if (!itens.length) return;
      mostrados += itens.length;
      const sec = el('section', 'sec' + (closed[si] && !busca ? ' closed' : ''));
      const head = el('button', 'head'); head.type = 'button';
      head.setAttribute('aria-expanded', String(!(closed[si] && !busca)));
      const falta = s.itens.filter(it => contavel(s, it) && !checks[it.id]).length;
      head.append(el('span', 'chev'), el('span', null, s.nome),
        el('span', 'n', s.info ? '' : (falta ? falta + ' faltam' : (s.itens.some(it => contavel(s, it)) ? 'completo' : ''))));
      head.addEventListener('click', () => { closed[si] = !closed[si]; render(); });
      const ul = el('ul');
      itens.forEach(it => {
        const li = el('li', 'it' + (s.info ? ' static' : '') + (checks[it.id] ? ' done' : ''));
        if (!s.info) { li.setAttribute('role', 'checkbox'); li.setAttribute('aria-checked', String(!!checks[it.id])); li.tabIndex = 0; }
        li.append(s.info ? el('span', 'dot') : el('span', 'box', '✓'));
        const body = el('div', 'body'), nm = el('span', 'nm', it.nome);
        if (it.tipo === 'add' && !s.info) nm.append(el('span', 'tag add', 'adicionado'));
        if (it.tipo === 'opt') nm.append(el('span', 'tag opt', 'decidir lá'));
        body.append(nm);
        if (it.nota) body.append(el('span', 'nt', it.nota));
        li.append(body);
        if (it.qtd) li.append(el('span', 'qt', it.qtd));
        if (!s.info) {
          const toggle = () => { if (checks[it.id]) delete checks[it.id]; else checks[it.id] = 1; save(); render(); };
          li.addEventListener('click', toggle);
          li.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });
        }
        ul.append(li);
      });
      sec.append(head, ul); list.append(sec);
    });

    if (!mostrados) {
      const e = el('div', 'empty');
      e.append(el('b', null, busca ? 'Nada encontrado' : (filtro === 'falta' ? 'Tudo comprado 🎉' : 'Nada por aqui')),
        document.createTextNode(busca ? 'Tente outra palavra.' : (filtro === 'falta' ? 'Não falta nenhum item.' : 'Mude o filtro acima.')));
      list.append(e);
    }
  }
})();
</script>
