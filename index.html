<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fdf6e7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Praia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Feriado na praia</title>
<script>
/* Logo (sol se pondo no mar) + ícones + manifesto, tudo embutido: a publicação só leva o index.html.
   Se algo aqui falhar, o app continua funcionando normalmente. */
(() => { try {
  const logo = r => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'
    + '<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3a3"/><stop offset="1" stop-color="#bdeee4"/></linearGradient>'
    + '<linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34c9b8"/><stop offset="1" stop-color="#0e8a8c"/></linearGradient></defs>'
    + '<rect width="512" height="512" rx="' + r + '" fill="url(#a)"/>'
    + '<circle cx="256" cy="226" r="132" fill="#ffc24b" opacity=".28"/><circle cx="256" cy="226" r="92" fill="#ffc24b"/>'
    + '<path d="M0 292C60 262 124 262 188 292S316 322 380 292S470 268 512 284V512H0Z" fill="url(#b)"/>'
    + '<path d="M0 292C60 262 124 262 188 292S316 322 380 292S470 268 512 284" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".85"/>'
    + '<path d="M0 372C60 346 124 346 188 372S316 398 380 372S470 352 512 366V512H0Z" fill="#0b6f73" opacity=".6"/></svg>';
  const uri = s => 'data:image/svg+xml,' + encodeURIComponent(s);
  window.__LOGO__ = uri(logo(112));                       // com cantos arredondados (favicon, banner)
  const addLink = (rel, href, extra) => { const l = document.createElement('link'); l.rel = rel; l.href = href; if (extra) Object.keys(extra).forEach(k => l.setAttribute(k, extra[k])); document.head.append(l); return l; };
  addLink('icon', window.__LOGO__, { type: 'image/svg+xml' });
  // PNG a partir do SVG (o iPhone exige PNG no ícone da tela inicial; o Android usa no manifesto)
  const png = size => new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = size; c.getContext('2d').drawImage(img, 0, 0, size, size); ok(c.toDataURL('image/png')); };
    img.onerror = no; img.src = uri(logo(0));              // sem cantos: o sistema arredonda sozinho
  });
  Promise.all([png(180), png(192), png(512)]).then(([p180, p192, p512]) => {
    addLink('apple-touch-icon', p180, { sizes: '180x180' });
    const m = { name: 'Feriado na praia', short_name: 'Praia', lang: 'pt-BR', display: 'standalone',
      start_url: location.href.split('#')[0], scope: new URL('.', location.href).href,
      background_color: '#fdf6e7', theme_color: '#0e8a8c',
      icons: [{ src: p192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: p512, sizes: '512x512', type: 'image/png', purpose: 'any' },
              { src: p512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
    addLink('manifest', URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })));
  }).catch(() => {});
} catch (e) {} })();
</script>
<style>
:root{
  --bg:#fdf6e7; --card:#ffffff; --ink:#15383f; --mute:#68868b; --line:#f0e5cc;
  --sea:#0e8a8c; --sea-ink:#ffffff; --foam:#e3f5f1; --coral:#ff7a59; --coral-soft:#ffe6de; --sun:#ffc24b; --sun-soft:#fff1cf;
  --sky1:#ffe7b0; --sky2:#bdeee4; --sea1:#2cc0b1; --sea2:#0e8a8c;
  --t1:#ffe6de; --t2:#fff1cf; --t3:#e0f4ef; --t4:#e6ecff; --t5:#f6e4f4; --t6:#e5f3d6;
  --shadow:0 6px 24px rgba(21,56,63,.10); --r:20px;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1b21; --card:#12303a; --ink:#e8f4f2; --mute:#8fb0b4; --line:#1c404b;
    --sea:#38d0c0; --sea-ink:#06232a; --foam:#143a42; --coral:#ff8f73; --coral-soft:#3b2620; --sun:#ffc24b; --sun-soft:#3a3016;
    --sky1:#3a3a45; --sky2:#124650; --sea1:#17766f; --sea2:#0f4f58;
    --t1:#3b2620; --t2:#3a3016; --t3:#12383a; --t4:#1e2848; --t5:#36223a; --t6:#233618;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,a{font:inherit;color:inherit}
a{text-decoration:none}
[hidden]{display:none!important}
svg{display:block}

/* ---------- login ---------- */
#lock{min-height:100dvh;display:grid;place-items:center;padding:20px;
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 62%,var(--sea1) 62%,var(--sea2))}
#lock form{width:min(100%,360px);background:var(--card);border-radius:28px;padding:30px 26px;box-shadow:var(--shadow);text-align:center}
#lock .sun{font-size:44px;line-height:1;margin-bottom:6px}
#lock h1{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.01em}
#lock p{margin:0 0 20px;color:var(--mute);font-size:15px}
#lock input{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg);font-size:17px;text-align:center}
#lock input:focus{outline:none;border-color:var(--sea)}
#lock .go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:16px;background:var(--sea);color:var(--sea-ink);font-weight:800;font-size:16px;cursor:pointer}
#lock .go:disabled{opacity:.6;cursor:wait}
#lock .err{min-height:22px;margin-top:10px;color:var(--coral);font-size:14px;font-weight:600}

/* ---------- layout do app ---------- */
#app{min-height:100dvh}
#view{max-width:760px;margin:0 auto;padding:0 18px calc(110px + env(safe-area-inset-bottom))}
nav#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;
  width:min(calc(100% - 24px),520px);display:flex;gap:2px;padding:6px;background:var(--card);border-radius:26px;box-shadow:0 10px 34px rgba(21,56,63,.22);border:1px solid var(--line)}
nav#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border-radius:20px;color:var(--mute);font-size:11px;font-weight:700;transition:.15s}
nav#nav a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav#nav a[aria-current="page"]{background:var(--sea);color:var(--sea-ink)}
@media (min-width:900px){
  #app{display:grid;grid-template-columns:220px 1fr}
  nav#nav{position:sticky;top:0;left:auto;transform:none;bottom:auto;width:auto;height:100dvh;flex-direction:column;justify-content:flex-start;gap:6px;
    padding:28px 14px;border-radius:0;border:0;border-right:1px solid var(--line);box-shadow:none;background:transparent}
  nav#nav::before{content:"🌴 Feriado";display:block;font-weight:800;font-size:19px;padding:0 12px 18px}
  nav#nav a{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:15px}
  #view{max-width:900px;width:100%;padding:0 32px 60px}
}

/* ---------- topo ---------- */
.hero{position:relative;margin:calc(12px + env(safe-area-inset-top)) 0 8px;padding:42px 24px 70px;border-radius:32px;
  background:linear-gradient(180deg,var(--sky1),var(--sky2));overflow:hidden}
@media (min-width:900px){.hero{margin:28px 0 8px;border-radius:36px;padding-bottom:84px}}
.hero .sun{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#ffd66b 0 55%,rgba(255,214,107,.35) 56% 100%)}
.hero h1{position:relative;margin:0;font-size:clamp(34px,9vw,52px);line-height:1.02;font-weight:850;letter-spacing:-.025em;max-width:11ch;color:#15383f}
.hero p{position:relative;margin:10px 0 0;font-size:17px;max-width:26ch;color:#2c5a60}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h1{color:#e8f4f2}:root:not([data-theme="light"]) .hero p{color:#a9cfd1}}
.hero svg{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:60px;fill:var(--bg)}
.page-head{padding:calc(34px + env(safe-area-inset-top)) 2px 14px}
.page-head h1{margin:0;font-size:32px;font-weight:850;letter-spacing:-.02em}
.page-head p{margin:4px 0 0;color:var(--mute)}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;color:var(--sea);font-weight:800;font-size:15px;background:none;border:0;padding:6px 0;cursor:pointer}

h2.sec{margin:28px 2px 12px;font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:baseline;justify-content:space-between}
h2.sec a{font-size:14px;color:var(--sea);font-weight:700}

/* ---------- início ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-34px;position:relative;z-index:2}
.stat{background:var(--card);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-weight:850;line-height:1.1}
.stat span{font-size:12.5px;color:var(--mute);font-weight:600}
.cd{position:relative;overflow:hidden;margin-top:14px;padding:18px 20px 14px;border-radius:24px;color:#15383f;
  background:linear-gradient(135deg,var(--sun-soft),var(--coral-soft));box-shadow:var(--shadow);border:1px solid var(--line);
  display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.cd-emo{font-size:46px;line-height:1;animation:cdb 3.2s ease-in-out infinite}
@keyframes cdb{50%{transform:translateY(-4px) rotate(-6deg)}}
.cd-n{font-size:clamp(40px,12vw,58px);font-weight:900;line-height:1;letter-spacing:-.03em;color:var(--coral)}
.cd-n small{font-size:20px;font-weight:800;margin-left:8px;letter-spacing:0;color:#15383f}
.cd-main p{margin:4px 0 0;font-size:15px;font-weight:650;color:#2c5a60}
.cd-dates{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;padding-top:10px;border-top:1.5px dashed rgba(21,56,63,.18);font-size:13px;color:#2c5a60}
.cd-dates b{color:#15383f}
.cd-wave{position:absolute;right:-20px;bottom:-26px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(14,138,140,.16) 0 60%,transparent 61%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cd{color:#e8f4f2}:root:not([data-theme="light"]) .cd-n small,:root:not([data-theme="light"]) .cd-dates b{color:#e8f4f2}:root:not([data-theme="light"]) .cd-main p,:root:not([data-theme="light"]) .cd-dates{color:#a9cfd1}}
@media (prefers-reduced-motion:reduce){.cd-emo{animation:none}}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 12px;scroll-snap-type:x proximity;scroll-padding:0 18px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
@media (min-width:900px){.hscroll{margin:0 -32px;padding:2px 32px 12px;scroll-padding:0 32px}}
.daycard{flex:none;width:210px;scroll-snap-align:start;border-radius:22px;padding:16px;color:var(--ink);min-height:150px;display:flex;flex-direction:column}
.daycard .e{font-size:30px;line-height:1}
.daycard small{display:block;margin-top:10px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.daycard b{font-size:18px;font-weight:800;line-height:1.2}
.daycard p{margin:6px 0 0;font-size:13.5px;color:var(--mute);line-height:1.35}
.help{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.help .e{font-size:26px}
.help .tx{flex:1;min-width:0}
.help .tx b{display:block;font-weight:800}
.help .tx span{font-size:13px;color:var(--mute)}
.pill{display:inline-block;border:0;border-radius:99px;padding:9px 16px;background:var(--coral);color:#fff;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.pill.ghost{background:var(--foam);color:var(--sea)}
.crew{display:flex;align-items:center;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);gap:14px}
.crew .stk{display:flex;flex:1;min-width:0;overflow:hidden}
.crew .stk .av{flex:none;margin-left:-10px;border:3px solid var(--card)}
.crew .stk .av:first-child{margin-left:0}
.crew .tx{flex:none;white-space:nowrap;margin-left:auto;text-align:right;font-weight:800}
@media (max-width:430px){.crew .stk .av:nth-child(n+5){display:none}}
.crew .tx span{display:block;font-weight:600;font-size:12.5px;color:var(--mute)}

/* ---------- roteiro ---------- */
.timeline{position:relative;padding-left:4px}
.day{position:relative;background:var(--card);border-radius:24px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.day .top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.day .badge{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:26px}
.day small{display:block;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.day h3{margin:0;font-size:21px;font-weight:850;letter-spacing:-.01em}
.meal{display:flex;gap:12px;padding:9px 0;border-top:1px dashed var(--line)}
.meal i{font-style:normal;font-size:20px;width:26px;text-align:center}
.meal div{flex:1}
.meal small{display:block;color:var(--mute);font-weight:700;font-size:12px}
.meal.main span{font-weight:700}
.daynote{margin-top:6px;padding:10px 12px;background:var(--sun-soft);border-radius:14px;font-size:13.5px}

/* ---------- compras ---------- */
.search{width:100%;padding:14px 18px;border:2px solid var(--line);border-radius:18px;background:var(--card);font-size:16px;margin:2px 0 16px}
.search:focus{outline:none;border-color:var(--sea)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{border:0;border-radius:24px;padding:16px;text-align:left;cursor:pointer;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .e{font-size:34px;line-height:1}
.tile b{display:block;font-weight:800;font-size:16px;line-height:1.2}
.tile span{font-size:13px;color:var(--mute);font-weight:600}
.items{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.it{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.it .r{display:flex;align-items:baseline;gap:10px}
.it .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.it .qt{flex:none;max-width:45%;text-align:right;font-weight:800;color:var(--sea);font-size:15px}
.it .nt{margin:3px 0 0;font-size:13px;color:var(--mute);line-height:1.35}
.it .acts{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}
.it.open .acts{display:flex}
.it.open{background:var(--foam)}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800;vertical-align:1px}
.tag.add{background:var(--sun-soft);color:#a96a00}
.tag.opt{background:var(--coral-soft);color:var(--coral)}
.from{padding:12px 16px 4px;font-weight:800;font-size:13px;color:var(--mute)}

/* ---------- casa e gente ---------- */
.rooms{display:grid;gap:12px}
@media (min-width:700px){.rooms{grid-template-columns:1fr 1fr}}
.chip .av.pet{background:var(--sun-soft);font-size:14px}
.seg2{display:inline-flex;gap:2px;margin:0 0 16px;padding:4px;background:var(--card);border-radius:99px;box-shadow:var(--shadow)}
.seg2 a{padding:8px 20px;border-radius:99px;font-weight:800;font-size:14px;color:var(--mute)}
.seg2 a[aria-current="page"]{background:var(--sea);color:var(--sea-ink)}
.room{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.room .hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.room .hd .b{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px}
.room h3{margin:0;font-size:18px;font-weight:850}
.room small{color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--bg);font-weight:700;font-size:14px}
.chip .av{width:26px;height:26px;font-size:11px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:850;font-size:14px;color:#15383f}
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.people{grid-template-columns:repeat(3,1fr)}}
.pc{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.pc b{display:block;font-weight:800;line-height:1.15}
.pc div span{display:block;margin-top:1px;font-size:12.5px;line-height:1.25;color:var(--mute);font-weight:600}
.aviso{margin:0 0 16px;padding:14px 16px;background:var(--sun-soft);border:2px dashed var(--sun);border-radius:20px;font-size:14.5px;line-height:1.4}
.aviso b{display:block;margin-bottom:2px;font-size:15px}
.cnt{display:flex;gap:8px;flex-wrap:wrap}
.cnt .n{display:inline-flex;align-items:baseline;gap:6px;padding:8px 14px;border-radius:14px;background:var(--foam);font-weight:700;font-size:14px;color:var(--mute)}
.cnt .n b{font-size:22px;font-weight:850;color:var(--ink)}
.cnt .n.k{background:var(--sun-soft)}
.rn{margin:10px 2px 0;font-size:13px;color:var(--mute)}
.warnbox{background:var(--sun-soft);border-radius:20px;padding:14px 16px}
.secret{margin:0 0 16px;padding:16px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.secret.open{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.secret b{font-size:16px}.secret span{font-size:14px;color:var(--mute)}
.revform{display:flex;gap:8px;margin-top:6px}
.revform input{flex:1;min-width:0;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);font-size:16px}
.revform input:focus{outline:none;border-color:var(--sea)}
.secret .err{min-height:0;font-size:13.5px;font-weight:700;color:var(--coral)}
.chips.reveal{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.warnbox{margin-top:14px}.warnbox b{display:block;margin-bottom:4px}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}

.rodape{text-align:center;margin:30px 0 0}
.sair{all:unset;cursor:pointer;padding:8px 12px;font-size:12px;color:var(--mute);text-decoration:underline;opacity:.8}
.sair:focus-visible{outline:2px solid var(--sea);border-radius:8px}

/* ---------- logo e instalar como app ---------- */
#lock .sun img{width:84px;height:84px;border-radius:22px;box-shadow:0 8px 22px rgba(21,56,63,.22)}
.instbar{position:sticky;top:0;z-index:15;grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px 12px;background:var(--sea);color:var(--sea-ink)}
.instbar img{flex:none;width:38px;height:38px;border-radius:10px}
.instgo{all:unset;box-sizing:border-box;flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;line-height:1.2}
.instgo b{font-size:15px;font-weight:800}
.instgo span{font-size:12.5px;opacity:.9}
.instgo:focus-visible,.instx:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:8px}
.instx{all:unset;box-sizing:border-box;flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;cursor:pointer;font-size:15px;opacity:.85}
.guia{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.guia .nt,.sheet .nt{margin:0;font-size:14px;color:var(--mute);line-height:1.4}
.guia ol.steps{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.45}
.guia ol.steps li{display:flex;gap:10px;align-items:flex-start}
.guia .n{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;background:var(--sea);color:var(--sea-ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.glw{display:inline-block;vertical-align:-4px}
.gl{width:20px;height:20px;display:inline-block;color:var(--sea)}
.sheet-ov{position:fixed;inset:0;z-index:50;background:rgba(10,27,33,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.sheet-ov{align-items:center}}
.sheet{position:relative;width:min(100%,520px);max-height:88dvh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:26px 20px calc(22px + env(safe-area-inset-bottom));animation:pop .3s ease}
@media (min-width:700px){.sheet{border-radius:28px}}
.sheet img{width:64px;height:64px;border-radius:17px;box-shadow:var(--shadow)}
.sheet h2{margin:12px 0 4px;font-size:22px;font-weight:850}
.sheet-x{all:unset;position:absolute;top:14px;right:14px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--bg);cursor:pointer;font-size:15px}
/* modo mercado */
.mercado-btn{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 14px;padding:14px 16px;border:0;border-radius:20px;background:var(--sea);color:var(--sea-ink);text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.mercado-btn .e{font-size:30px;line-height:1}
.mercado-btn b{display:block;font-size:17px;font-weight:850}
.mercado-btn span:not(.e){font-size:13px;opacity:.92}
.sheet.full{height:92dvh;max-height:92dvh;padding:0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){.sheet.full{height:min(86dvh,820px);width:min(100%,600px)}}
.mhead{flex:none;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0 44px 0 0;font-size:21px;font-weight:850}
.mprog{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px;color:var(--mute)}
.mprog .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.mprog .bar i{display:block;height:100%;width:0;background:var(--sea);border-radius:99px;transition:width .25s}
.mprog b{color:var(--ink)}
.mseg{display:flex;gap:6px}
.mseg button{flex:1;border:0;border-radius:12px;padding:9px 6px;background:var(--bg);font-weight:800;font-size:14px;color:var(--mute);cursor:pointer}
.mseg button[aria-pressed="true"]{background:var(--sea);color:var(--sea-ink)}
.mbody{flex:1;overflow:auto;padding:2px 18px 18px;-webkit-overflow-scrolling:touch}
.mcat{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 4px}
.mcat b{font-size:15px;font-weight:850}
.mcat span{font-size:12.5px;font-weight:600;color:var(--mute)}
.mit{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.mit .cb{flex:none;width:28px;height:28px;border:2px solid var(--mute);border-radius:9px;display:grid;place-items:center;color:transparent;font-weight:900;transition:.12s}
.mit.on .cb{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.mit .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.mit .qt{flex:none;max-width:42%;text-align:right;font-weight:800;font-size:14px;color:var(--sea)}
.mit.on .nm{text-decoration:line-through;color:var(--mute);font-weight:600}
.mit.on .qt{color:var(--mute)}
.mit:focus-visible{outline:2px solid var(--sea);outline-offset:-2px;border-radius:10px}
.mfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.mfoot button{all:unset;cursor:pointer;color:var(--coral);font-weight:800;font-size:13px;text-decoration:underline;white-space:nowrap}
</style>
</head>

<script>
(() => {
  const E = window.__ENC__, $ = id => document.getElementById(id);
  const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let D = null;

  // ---------- util ----------
  const h = (tag, cls, ...kids) => {
    const n = document.createElement(tag); if (cls) n.className = cls;
    kids.flat().forEach(k => { if (k == null || k === false) return; n.append(k.nodeType ? k : document.createTextNode(k)); });
    return n;
  };
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const TINT = ['var(--t1)', 'var(--t2)', 'var(--t3)', 'var(--t4)', 'var(--t5)', 'var(--t6)'];
  const AVC = ['#ffc9b8', '#ffe29a', '#a9e5d9', '#c3d0ff', '#efc5ea', '#cfe8a8'];
  const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const iniciais = n => { const p = n.replace(/[()]/g, '').trim().split(/\s+/); return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase(); };
  const avatar = (n, cls) => { const a = h('span', 'av' + (cls ? ' ' + cls : ''), iniciais(n)); a.style.background = AVC[hash(n) % AVC.length]; return a; };
  const zap = txt => { const a = h('a', 'pill'); a.href = 'https://wa.me/?text=' + encodeURIComponent(txt); a.target = '_blank'; a.rel = 'noopener'; return a; };
  const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);

  const ICON = {
    inicio: '<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>',
    roteiro: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    compras: '<svg viewBox="0 0 24 24"><path d="M5.2 8h13.6l-1.1 10.8a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>',
    casa: '<svg viewBox="0 0 24 24"><path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11.2" r="1.8"/></svg>',
    gente: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.2" cy="9.2" r="2.5"/><path d="M16.2 14.3c2.7.3 4.8 2.4 4.8 5.2"/></svg>'
  };
  const TABS = [['inicio', 'Início'], ['roteiro', 'Roteiro'], ['compras', 'Compras'], ['casa', 'Casa'], ['gente', 'Gente']];

  // ---------- login ----------
  try { // logo no lugar do emoji da tela de senha
    const ls = document.querySelector('#lock .sun');
    if (ls && window.__LOGO__) { const im = h('img'); im.src = window.__LOGO__; im.alt = ''; ls.textContent = ''; ls.append(im); }
  } catch (e) {}
  if (!(window.crypto && crypto.subtle)) { $('err').textContent = 'Abra o link por https para liberar a criptografia.'; $('go').disabled = true; }
  const KEYPW = 'praia:acesso';   // senha de entrada guardada neste aparelho (some no "Sair")
  const guardar = pw => { try { localStorage.setItem(KEYPW, pw); } catch (e) {} };
  const esquecer = () => { try { localStorage.removeItem(KEYPW); } catch (e) {} };
  async function abrir(pw) {      // true se a senha abriu a lista
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(E.salt), iterations: E.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      D = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(E.iv) }, key, un(E.ct))));
    } catch (e) { return false; }
    $('pw').value = ''; $('lock').hidden = true; $('app').hidden = false; start(); return true;
  }
  $('lf').addEventListener('submit', async ev => {
    ev.preventDefault();
    const pw = $('pw').value; if (!pw) return;
    $('go').disabled = true; $('err').textContent = 'Abrindo…';
    if (await abrir(pw)) guardar(pw);
    else { $('err').textContent = 'Senha incorreta.'; $('go').disabled = false; $('pw').select(); }
  });
  (async () => {                  // já entrou antes neste aparelho: abre direto
    let salvo = null; try { salvo = localStorage.getItem(KEYPW); } catch (e) {}
    if (!salvo || !(window.crypto && crypto.subtle)) return;
    $('lf').style.visibility = 'hidden';            // só o fundo do mar enquanto abre
    if (!(await abrir(salvo))) { esquecer(); $('lf').style.visibility = ''; }
  })();

  // ---------- roteamento ----------
  function start() {
    document.title = D.titulo;
    const nav = $('nav');
    TABS.forEach(([id, nome]) => { const a = h('a'); a.href = '#/' + id; a.dataset.id = id; a.innerHTML = ICON[id]; a.append(h('span', null, nome)); nav.append(a); });
    try { const barra = barraInstalar(); if (barra) $('app').prepend(barra); } catch (e) {}
    window.addEventListener('hashchange', route); route();
  }
  function route() {
    const [tab, arg] = (location.hash || '#/inicio').slice(2).split('/');
    const t = VIEWS[tab] ? tab : 'inicio';
    document.querySelectorAll('#nav a').forEach(a => { if (a.dataset.id === t) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const sair = h('button', 'sair', 'Sair deste aparelho'); sair.type = 'button';
    sair.onclick = () => { esquecer(); location.hash = ''; location.reload(); };
    $('view').replaceChildren(VIEWS[t](arg), h('div', 'rodape', sair)); window.scrollTo(0, 0);
  }

  // ---------- telas ----------
  // ---------- nomes escondidos (brincadeira) ----------
  let REV = null;
  const refresh = () => { const y = window.scrollY; route(); window.scrollTo(0, y); };
  function cardRevelar() {
    const msg = h('div', 'err');
    const inp = h('input'); inp.type = 'password'; inp.placeholder = 'senha secreta'; inp.autocomplete = 'off'; inp.setAttribute('aria-label', 'Senha secreta');
    const btn = h('button', 'pill', 'Revelar'); btn.type = 'submit';
    const f = h('form', 'revform', inp, btn); f.autocomplete = 'off';
    f.addEventListener('submit', async ev => {
      ev.preventDefault(); if (!inp.value) return; btn.disabled = true; msg.textContent = '';
      try {
        const b = D.revelar;
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(inp.value), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(b.salt), iterations: b.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        REV = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(b.iv) }, key, un(b.ct))));
        refresh();
      } catch (e) { msg.textContent = 'Senha errada 🙈 Dica: quem manda na família.'; btn.disabled = false; inp.select(); }
    });
    return h('div', 'secret', h('b', null, '🎁 Quer saber quem fica onde?'), h('span', null, 'Tem uma senha secreta para ver os nomes.'), f, msg);
  }
  function cardEscondido() {
    const b = h('button', 'pill ghost', 'Esconder de novo'); b.type = 'button';
    b.onclick = () => { REV = null; refresh(); };
    return h('div', 'secret open', h('b', null, '🔓 Nomes revelados'), b);
  }

  // ---------- instalar como app ----------
  const standalone = () => { try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; } };
  const SO = (() => {
    const ua = navigator.userAgent || '';
    if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
    if (/Android/i.test(ua)) return 'android';
    return 'outro';
  })();
  let instEvt = null;   // o Chrome do Android às vezes oferece instalar com um clique
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEvt = e; });
  window.addEventListener('appinstalled', () => { instEvt = null; const b = document.getElementById('instbar'); if (b) b.remove(); });
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  // pequenos ícones desenhados no meio do texto (iguais aos do iPhone)
  const GL = {
    dots: '<circle cx="5" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="19" cy="12" r="1.9" fill="currentColor"/>',
    share: '<path d="M12 3v12M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    add: '<rect x="4" y="4" width="16" height="16" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
  };
  const gl = k => { const s = h('span', 'glw'); s.innerHTML = '<svg class="gl" viewBox="0 0 24 24" aria-hidden="true">' + GL[k] + '</svg>'; return s; };
  const b = t => h('b', null, t);
  const PASSOS = {   // funções: cada chamada cria elementos novos (um elemento só pode estar em um lugar)
    ios: () => [
      ['Toque nos três pontinhos ', gl('dots'), ' ao lado do endereço, na barra de baixo do Safari.'],
      ['Toque em ', b('Compartilhar'), ' ', gl('share'), ' e depois em ', b('Ver mais'), '.'],
      ['Toque em ', b('Adicionar à Tela de Início'), ' ', gl('add'), ' e depois em ', b('Adicionar'), '.']],
    android: () => [
      ['Toque nos três pontinhos ', b('⋮'), ' no canto do Chrome.'],
      ['Toque em ', b('Instalar app'), ' (ou ', b('Adicionar à tela inicial'), ').'],
      ['Confirme em ', b('Instalar'), '.']]
  };
  const DICA = 'Depois, abra a lista pelo ícone novo na tela de início.';
  function guia() {
    const box = h('div', 'guia');
    if (SO === 'android' && instEvt) {   // o Chrome do Android deixa instalar com um toque; o iPhone não permite
      const b = h('button', 'pill', 'Instalar agora'); b.type = 'button';
      b.onclick = async () => { try { instEvt.prompt(); await instEvt.userChoice; } catch (e) {} instEvt = null; };
      box.append(b); return box;
    }
    const ol = h('ol', 'steps'); (PASSOS[SO] ? PASSOS[SO]() : []).forEach((p, i) => ol.append(h('li', null, h('span', 'n', String(i + 1)), h('span', null, p))));
    box.append(ol, h('p', 'nt', DICA)); return box;
  }
  function abrirGuia() {
    const ov = h('div', 'sheet-ov'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Instalar o app');
    const esc = e => { if (e.key === 'Escape') fechar(); };
    const fechar = () => { ov.remove(); document.removeEventListener('keydown', esc); };
    const x = h('button', 'sheet-x', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Fechar'); x.onclick = fechar;
    const logo = h('img'); logo.src = window.__LOGO__ || ''; logo.alt = '';
    ov.append(h('div', 'sheet', x, logo, h('h2', null, 'Instale como app'),
      h('p', 'nt', 'Fica na tela inicial com o ícone da praia e abre direto, sem a barra do navegador.'), guia()));
    ov.addEventListener('click', e => { if (e.target === ov) fechar(); });
    document.addEventListener('keydown', esc); document.body.append(ov);
  }

  // ---------- modo mercado: lista para marcar o que já está no carrinho (só neste aparelho) ----------
  const MKEY = 'praia:mercado';
  const mLer = () => { try { return JSON.parse(localStorage.getItem(MKEY) || '{}') || {}; } catch (e) { return {}; } };
  const mSalvar = o => { try { localStorage.setItem(MKEY, JSON.stringify(o)); } catch (e) {} };
  function abrirMercado() {
    let marc = mLer(), filtro = 'falta';
    const secs = D.secoes.filter(s => !s.info && !s.leva);   // o que se compra no mercado
    const conta = it => it.tipo !== 'opt';                     // "decidir lá" aparece, mas não entra na conta
    const ov = h('div', 'sheet-ov'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Lista do mercado');
    const esc = e => { if (e.key === 'Escape') fechar(); };
    const fechar = () => { ov.remove(); document.removeEventListener('keydown', esc); document.body.style.overflow = ''; };
    const x = h('button', 'sheet-x', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Fechar'); x.onclick = fechar;
    const barf = h('i'), progt = h('span'), body = h('div', 'mbody');
    const seg = h('div', 'mseg');
    [['falta', 'Falta'], ['carrinho', 'No carrinho'], ['tudo', 'Tudo']].forEach(([k, nome]) => {
      const b = h('button', null, nome); b.type = 'button'; b.dataset.f = k; b.setAttribute('aria-pressed', String(k === filtro));
      b.onclick = () => { filtro = k; seg.querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', String(o === b))); body.scrollTop = 0; render(); };
      seg.append(b);
    });
    const render = () => {
      const y = body.scrollTop; body.textContent = '';
      let total = 0, feitos = 0, mostrou = 0;
      secs.forEach(s => s.itens.forEach(it => { if (conta(it)) { total++; if (marc[it.id]) feitos++; } }));
      progt.replaceChildren(h('b', null, feitos + ' de ' + total), ' no carrinho');
      barf.style.width = (total ? feitos / total * 100 : 0) + '%';
      secs.forEach(s => {
        const its = s.itens.filter(it => filtro === 'tudo' || (filtro === 'carrinho' ? marc[it.id] : !marc[it.id]));
        if (!its.length) return;
        mostrou += its.length;
        const falta = s.itens.filter(it => conta(it) && !marc[it.id]).length;
        body.append(h('div', 'mcat', h('b', null, s.emoji + ' ' + s.nome), h('span', null, falta ? falta + ' faltam' : 'completo')));
        its.forEach(it => {
          const on = !!marc[it.id];
          const row = h('div', 'mit' + (on ? ' on' : ''), h('span', 'cb', '✓'),
            h('span', 'nm', it.nome, it.tipo === 'opt' ? h('span', 'tag opt', 'decidir lá') : null), it.qtd ? h('span', 'qt', it.qtd) : null);
          row.setAttribute('role', 'checkbox'); row.setAttribute('aria-checked', String(on)); row.tabIndex = 0;
          const toggle = () => { if (marc[it.id]) delete marc[it.id]; else marc[it.id] = 1; mSalvar(marc); render(); };
          row.addEventListener('click', toggle);
          row.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });
          body.append(row);
        });
      });
      if (!mostrou) body.append(h('div', 'empty', filtro === 'falta' ? 'Tudo no carrinho 🎉' : 'Nada por aqui'));
      body.scrollTop = y;
    };
    const limpar = h('button', null, 'Limpar marcações'); limpar.type = 'button';
    limpar.onclick = () => { if (window.confirm('Limpar todas as marcações deste aparelho?')) { marc = {}; mSalvar(marc); render(); } };
    const head = h('div', 'mhead', h('h2', null, '🛒 No mercado'), h('div', 'mprog', h('div', 'bar', barf), progt), seg);
    ov.append(h('div', 'sheet full', x, head, body, h('div', 'mfoot', h('span', null, 'As marcações ficam só neste aparelho.'), limpar)));
    ov.addEventListener('click', e => { if (e.target === ov) fechar(); });
    document.addEventListener('keydown', esc); document.body.style.overflow = 'hidden'; document.body.append(ov);
    render();
  }
  function barraInstalar() {
    const dispensadoEm = +lsGet('praia:instalar-em') || 0;      // "Agora não": o convite volta em 7 dias
    if (standalone() || SO === 'outro' || Date.now() - dispensadoEm < 7 * 864e5) return null;
    const b = h('div', 'instbar'); b.id = 'instbar';
    const logo = h('img'); logo.src = window.__LOGO__ || ''; logo.alt = '';
    const go = h('button', 'instgo', h('b', null, 'Instale como app'), h('span', null, 'Veja como colocar na tela inicial')); go.type = 'button'; go.onclick = abrirGuia;
    const x = h('button', 'instx', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Dispensar'); x.onclick = () => { lsSet('praia:instalar-em', String(Date.now())); b.remove(); };
    b.append(logo, go, x); return b;
  }

  const VIEWS = {};

  // contagem regressiva: check-in 22/12, check-out 27/12 (2026)
  const contagem = () => {
    const DIA = 86400000, ano = 2026;
    const ini = Date.UTC(ano, 11, 22), fim = Date.UTC(ano, 11, 27);
    const t = new Date(), hoje = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
    let num, rot, msg, emo = '🏖️';
    if (hoje < ini) {
      const d = Math.round((ini - hoje) / DIA);
      num = String(d); rot = d === 1 ? 'dia' : 'dias';
      msg = d === 1 ? 'É amanhã! Já pode fechar a mala 🧳' : 'para o check-in, dia 22 de dezembro';
    } else if (hoje < fim) {
      const n = Math.round((hoje - ini) / DIA) + 1, falta = Math.round((fim - hoje) / DIA);
      num = hoje === ini ? 'Hoje!' : 'Dia ' + n; rot = '';
      msg = hoje === ini ? 'Chegamos! Bora pro mar 🌊' : (falta === 1 ? 'Último dia, check-out amanhã' : 'Faltam ' + falta + ' dias para o check-out');
      emo = '☀️';
    } else if (hoje === fim) {
      num = 'Hoje'; rot = ''; msg = 'Dia do check-out. Valeu, praia! 💛'; emo = '🧡';
    } else {
      num = 'Até a próxima'; rot = ''; msg = 'Que feriado bom foi esse 💛'; emo = '🐚';
    }
    const total = Math.round((fim - ini) / DIA);
    const c = h('div', 'cd',
      h('div', 'cd-wave'),
      h('div', 'cd-emo', emo),
      h('div', 'cd-main', h('div', 'cd-n', num, rot ? h('small', null, rot) : null), h('p', null, msg)),
      h('div', 'cd-dates', h('span', null, 'check-in ', h('b', null, '22/12')), h('span', null, 'check-out ', h('b', null, '27/12')), h('span', null, total + ' noites')));
    return c;
  };

  VIEWS.inicio = () => {
    const wrap = h('div');
    const hero = h('div', 'hero', h('div', 'sun'), h('h1', null, D.titulo), h('p', null, D.sub));
    hero.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 30 C50 8 100 8 150 30 S250 52 300 30 S370 10 400 26 V60 H0Z"/></svg>');
    const adultos = D.gente.filter(g => g.tipo === 'adulto').length, criancas = D.gente.length - adultos;
    const stats = h('div', 'stats',
      h('div', 'stat', h('b', null, String(D.gente.length)), h('span', null, 'pessoas')),
      h('div', 'stat', h('b', null, String(D.roteiro.length)), h('span', null, 'dias de praia')),
      h('div', 'stat', h('b', null, String(D.itens_total)), h('span', null, 'itens na lista')));
    wrap.append(hero, stats, contagem());

    const rs = h('h2', 'sec', 'Roteiro'); const rl = h('a'); rl.href = '#/roteiro'; rl.textContent = 'ver tudo'; rs.append(rl);
    const hs = h('div', 'hscroll');
    D.roteiro.forEach((d, i) => {
      const c = h('a', 'daycard', h('span', 'e', d.emoji), h('small', null, d.dia), h('b', null, d.titulo), h('p', null, d.almojanta || ''));
      c.href = '#/roteiro'; c.style.background = TINT[i % TINT.length]; hs.append(c);
    });
    wrap.append(rs, hs);

    const leva = D.secoes.filter(s => s.leva).flatMap(s => s.itens);
    if (leva.length) {
      wrap.append(h('h2', 'sec', 'Preciso de voluntário'));
      leva.forEach(it => {
        const b = zap(`Eu levo: ${it.nome}`); b.textContent = 'Eu levo';
        wrap.append(h('div', 'help', h('span', 'e', '🙋'), h('div', 'tx', h('b', null, it.nome), h('span', null, it.nota || 'Quem tiver, leva.')), b));
      });
    }

    const gl = h('a'); gl.href = '#/gente'; gl.textContent = 'ver todos';
    wrap.append(h('h2', 'sec', 'Quem vem', gl));
    const crew = h('div', 'crew'), stk = h('div', 'stk'); D.gente.slice(0, 7).forEach(g => stk.append(avatar(g.nome)));
    crew.append(stk, h('div', 'tx', `${D.gente.length} pessoas`, h('span', null, 'adultos e crianças')));
    wrap.append(crew);
    if (!standalone() && SO !== 'outro') wrap.append(h('h2', 'sec', '📲 Instalar o app'),
      h('div', 'secret', h('span', null, 'Salve na tela inicial para abrir como app, direto, com o ícone da praia.'), guia()));
    return wrap;
  };

  VIEWS.roteiro = () => {
    const wrap = h('div', null, h('div', 'page-head', h('h1', null, 'Roteiro'), h('p', null, 'O que vamos comer em cada dia. É uma sugestão para a gente ajustar.')));
    const tl = h('div', 'timeline');
    D.roteiro.forEach((d, i) => {
      const badge = h('div', 'badge', d.emoji); badge.style.background = TINT[i % TINT.length];
      const day = h('div', 'day', h('div', 'top', badge, h('div', null, h('small', null, d.dia), h('h3', null, d.titulo))));
      [['cafe', '☕', 'Café da manhã'], ['almojanta', '🍽️', 'Almojanta'], ['lanche', '🍉', 'Lanche']].forEach(([k, e, l]) => {
        if (d[k]) day.append(h('div', 'meal' + (k === 'almojanta' ? ' main' : ''), h('i', null, e), h('div', null, h('small', null, l), h('span', null, d[k]))));
      });
      if (d.nota) day.append(h('div', 'daynote', '💡 ' + d.nota));
      tl.append(day);
    });
    wrap.append(tl); return wrap;
  };

  function linha(it, secEmoji) {
    const row = h('div', 'it');
    const nm = h('span', 'nm', it.nome);
    if (it.tipo === 'add') nm.append(h('span', 'tag add', 'novo'));
    if (it.tipo === 'opt') nm.append(h('span', 'tag opt', 'decidir lá'));
    row.append(h('div', 'r', secEmoji ? h('span', null, secEmoji) : null, nm, it.qtd ? h('span', 'qt', it.qtd) : null));
    if (it.nota) row.append(h('p', 'nt', it.nota));
    const sug = zap(`Sobre "${it.nome}"${it.qtd ? ' (' + it.qtd + ')' : ''} na lista do feriado: `); sug.className = 'pill ghost'; sug.textContent = '💬 Sugerir mudança';
    const lev = zap(`Eu levo: ${it.nome}`); lev.textContent = '🙋 Eu levo';
    row.append(h('div', 'acts', lev, sug));
    row.addEventListener('click', e => { if (e.target.closest('a')) return; row.classList.toggle('open'); });
    return row;
  }

  VIEWS.compras = arg => {
    const wrap = h('div');
    if (arg !== undefined && D.secoes[+arg]) {
      const s = D.secoes[+arg];
      const back = h('button', 'back', '← Compras'); back.onclick = () => { location.hash = '#/compras'; };
      wrap.append(h('div', 'page-head', back, h('h1', null, `${s.emoji} ${s.nome}`), h('p', null, plural(s.itens.length, 'item', 'itens') + '. Toque num item para sugerir mudança ou dizer que leva.')));
      const box = h('div', 'items'); s.itens.forEach(it => box.append(linha(it))); wrap.append(box); return wrap;
    }
    wrap.append(h('div', 'page-head', h('h1', null, 'Compras'), h('p', null, 'Tudo o que vamos levar para o feriado, para todo mundo saber.')));
    const mb = h('button', 'mercado-btn', h('span', 'e', '🛒'), h('div', null, h('b', null, 'Estou no mercado'), h('span', null, 'Abrir a lista para marcar o que já está no carrinho')));
    mb.type = 'button'; mb.onclick = abrirMercado; wrap.append(mb);
    const q = h('input', 'search'); q.type = 'search'; q.placeholder = '🔎  Buscar item (ex.: carvão)'; q.setAttribute('aria-label', 'Buscar item');
    const out = h('div'); wrap.append(q, out);
    const tiles = () => {
      const g = h('div', 'grid');
      D.secoes.forEach((s, i) => {
        const t = h('button', 'tile', h('span', 'e', s.emoji), h('div', null, h('b', null, s.nome), h('span', null, plural(s.itens.length, 'item', 'itens'))));
        t.style.background = TINT[i % TINT.length]; t.onclick = () => { location.hash = '#/compras/' + i; }; g.append(t);
      });
      return g;
    };
    const draw = () => {
      const v = norm(q.value.trim()); out.replaceChildren();
      if (!v) { out.append(tiles()); return; }
      const box = h('div', 'items'); let n = 0;
      D.secoes.forEach(s => s.itens.forEach(it => { if (norm(it.nome + ' ' + (it.nota || '')).includes(v)) { box.append(linha(it, s.emoji)); n++; } }));
      out.append(n ? box : h('div', 'empty', 'Nenhum item com esse nome.'));
    };
    q.addEventListener('input', draw); draw(); return wrap;
  };

  // Carros: cada pessoa leva "[carro N]" na observação (viagem.txt). Aqui separamos isso do texto mostrado.
  const carroDe = g => { const m = /\[carro\s*(\d+)\]/i.exec(g.nota || ''); return m ? +m[1] : 0; };
  const notaLimpa = g => (g.nota || '').replace(/\s*\[(carro\s*\d+|pet\s*\d+\s*:[^\]]*)\]/gi, '').trim();
  // Bichinhos: "[pet 4: Gray, Snow]" na observação de alguém = vão no carro 4 (não contam como pessoas)
  const petsDe = id => D.gente.flatMap(g => { const m = /\[pet\s*(\d+)\s*:\s*([^\]]+)\]/i.exec(g.nota || ''); return m && +m[1] === id ? m[2].split(',').map(s => s.trim()).filter(Boolean) : []; });
  function viewCarros() {
    const box = h('div'), porCarro = {};
    D.gente.forEach(g => { const c = carroDe(g); if (c) (porCarro[c] = porCarro[c] || []).push(g); });
    const ids = Object.keys(porCarro).map(Number).sort((a, b) => a - b);
    if (!ids.length) { box.append(h('div', 'empty', 'Os carros ainda não foram divididos.')); return box; }
    const grid = h('div', 'rooms');
    ids.forEach((id, i) => {
      const gs = porCarro[id], ad = gs.filter(g => g.tipo === 'adulto').length, cr = gs.length - ad;
      const b = h('div', 'b', '🚗'); b.style.background = TINT[i % TINT.length];
      const chips = h('div', 'chips'); gs.forEach(g => chips.append(h('span', 'chip', avatar(g.nome), g.nome)));
      const pets = petsDe(id);
      pets.forEach(n => { const pa = h('span', 'av pet', '🐱'); chips.append(h('span', 'chip', pa, n)); });
      const resumo = plural(gs.length, 'pessoa', 'pessoas') + ' · ' + plural(ad, 'adulto', 'adultos') + (cr ? ' + ' + plural(cr, 'criança', 'crianças') : '') + (pets.length ? ' · ' + plural(pets.length, 'gatinho', 'gatinhos') : '');
      grid.append(h('div', 'room', h('div', 'hd', b, h('div', null, h('h3', null, 'Carro ' + id), h('small', null, resumo))), chips));
    });
    box.append(grid);
    const sem = D.gente.filter(g => !carroDe(g));
    if (sem.length) {
      const chips = h('div', 'chips'); sem.forEach(g => chips.append(h('span', 'chip', avatar(g.nome), g.nome)));
      box.append(h('div', 'warnbox', h('b', null, plural(sem.length, 'pessoa ainda sem carro', 'pessoas ainda sem carro')), chips));
    }
    return box;
  }

  VIEWS.casa = arg => {
    const carros = arg === 'carros';
    const seg = h('div', 'seg2');
    [['', 'Quartos'], ['carros', 'Carros']].forEach(([k, nome]) => {
      const a = h('a', null, nome); a.href = '#/casa' + (k ? '/' + k : '');
      if ((k === 'carros') === carros) a.setAttribute('aria-current', 'page');
      seg.append(a);
    });
    const wrap = h('div', null, h('div', 'page-head', h('h1', null, 'Casa e carros'),
      h('p', null, carros ? 'Quem vai em qual carro. Se mudar alguém, avisa no grupo.' : 'Uma ideia de quanta gente em cada lugar.')), seg);
    if (carros) { wrap.append(viewCarros()); return wrap; }
    if (D.aviso_casa) wrap.append(h('div', 'aviso', h('b', null, '💡 Só uma sugestão'), D.aviso_casa));
    if (D.revelar) wrap.append(REV ? cardEscondido() : cardRevelar());
    const rooms = h('div', 'rooms'); let ad = 0, cr = 0;
    const conta = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
    D.casa.forEach((q, i) => {
      ad += q.adultos; cr += q.criancas;
      const b = h('div', 'b', q.emoji); b.style.background = TINT[i % TINT.length];
      const cnt = h('div', 'cnt');
      if (q.adultos) cnt.append(h('span', 'n', h('b', null, String(q.adultos)), q.adultos === 1 ? 'adulto' : 'adultos'));
      if (q.criancas) cnt.append(h('span', 'n k', h('b', null, String(q.criancas)), q.criancas === 1 ? 'criança' : 'crianças'));
      if (!q.adultos && !q.criancas) cnt.append(h('span', 'n', 'livre'));
      const card = h('div', 'room', h('div', 'hd', b, h('div', null, h('h3', null, q.nome), h('small', null, q.desc))), cnt);
      if (REV && REV[i]) { const chips = h('div', 'chips reveal'); REV[i].forEach(n => chips.append(h('span', 'chip', avatar(n), n))); card.append(chips); }
      if (q.nota) card.append(h('p', 'rn', q.nota));
      rooms.append(card);
    });
    wrap.append(rooms);
    const totA = D.gente.filter(g => g.tipo === 'adulto').length, totC = D.gente.length - totA;
    const fa = totA - ad, fc = totC - cr;
    if (fa > 0 || fc > 0) {
      const partes = [fa > 0 ? conta(fa, 'adulto', 'adultos') : null, fc > 0 ? conta(fc, 'criança', 'crianças') : null].filter(Boolean).join(' + ');
      wrap.append(h('div', 'warnbox', h('b', null, 'Faltam encaixar: ' + partes), 'Ainda não cabem nos lugares da sugestão acima.'));
    }
    return wrap;
  };

  VIEWS.gente = () => {
    const wrap = h('div', null, h('div', 'page-head', h('h1', null, 'Gente'), h('p', null, `${D.gente.length} pessoas no feriado.`)));
    [['adulto', 'Adultos'], ['crianca', 'Crianças']].forEach(([t, nome]) => {
      const l = D.gente.filter(g => g.tipo === t); if (!l.length) return;
      const g = h('div', 'people'); l.forEach(p => g.append(h('div', 'pc', avatar(p.nome), h('div', null, h('b', null, p.nome), notaLimpa(p) ? h('span', null, notaLimpa(p)) : null))));
      wrap.append(h('h2', 'sec', `${nome} (${l.length})`), g);
    });
    return wrap;
  };
})();
</script>
</body>
</html>
