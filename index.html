<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fdf6e7">
<title>Feriado na praia</title>
<style>
:root{
  --bg:#fdf6e7; --card:#ffffff; --ink:#15383f; --mute:#68868b; --line:#f0e5cc;
  --sea:#0e8a8c; --sea-ink:#ffffff; --foam:#e3f5f1; --coral:#ff7a59; --coral-soft:#ffe6de; --sun:#ffc24b; --sun-soft:#fff1cf;
  --sky1:#ffe7b0; --sky2:#bdeee4; --sea1:#2cc0b1; --sea2:#0e8a8c;
  --t1:#ffe6de; --t2:#fff1cf; --t3:#e0f4ef; --t4:#e6ecff; --t5:#f6e4f4; --t6:#e5f3d6;
  --shadow:0 6px 24px rgba(21,56,63,.10); --r:20px;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1b21; --card:#12303a; --ink:#e8f4f2; --mute:#8fb0b4; --line:#1c404b;
    --sea:#38d0c0; --sea-ink:#06232a; --foam:#143a42; --coral:#ff8f73; --coral-soft:#3b2620; --sun:#ffc24b; --sun-soft:#3a3016;
    --sky1:#3a3a45; --sky2:#124650; --sea1:#17766f; --sea2:#0f4f58;
    --t1:#3b2620; --t2:#3a3016; --t3:#12383a; --t4:#1e2848; --t5:#36223a; --t6:#233618;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,a{font:inherit;color:inherit}
a{text-decoration:none}
[hidden]{display:none!important}
svg{display:block}

/* ---------- login ---------- */
#lock{min-height:100dvh;display:grid;place-items:center;padding:20px;
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 62%,var(--sea1) 62%,var(--sea2))}
#lock form{width:min(100%,360px);background:var(--card);border-radius:28px;padding:30px 26px;box-shadow:var(--shadow);text-align:center}
#lock .sun{font-size:44px;line-height:1;margin-bottom:6px}
#lock h1{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.01em}
#lock p{margin:0 0 20px;color:var(--mute);font-size:15px}
#lock input{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg);font-size:17px;text-align:center}
#lock input:focus{outline:none;border-color:var(--sea)}
#lock .go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:16px;background:var(--sea);color:var(--sea-ink);font-weight:800;font-size:16px;cursor:pointer}
#lock .go:disabled{opacity:.6;cursor:wait}
#lock .err{min-height:22px;margin-top:10px;color:var(--coral);font-size:14px;font-weight:600}

/* ---------- layout do app ---------- */
#app{min-height:100dvh}
#view{max-width:760px;margin:0 auto;padding:0 18px calc(110px + env(safe-area-inset-bottom))}
nav#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;
  width:min(calc(100% - 24px),520px);display:flex;gap:2px;padding:6px;background:var(--card);border-radius:26px;box-shadow:0 10px 34px rgba(21,56,63,.22);border:1px solid var(--line)}
nav#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border-radius:20px;color:var(--mute);font-size:11px;font-weight:700;transition:.15s}
nav#nav a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav#nav a[aria-current="page"]{background:var(--sea);color:var(--sea-ink)}
@media (min-width:900px){
  #app{display:grid;grid-template-columns:220px 1fr}
  nav#nav{position:sticky;top:0;left:auto;transform:none;bottom:auto;width:auto;height:100dvh;flex-direction:column;justify-content:flex-start;gap:6px;
    padding:28px 14px;border-radius:0;border:0;border-right:1px solid var(--line);box-shadow:none;background:transparent}
  nav#nav::before{content:"🌴 Feriado";display:block;font-weight:800;font-size:19px;padding:0 12px 18px}
  nav#nav a{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:15px}
  #view{max-width:900px;width:100%;padding:0 32px 60px}
}

/* ---------- topo ---------- */
.hero{position:relative;margin:0 -18px 8px;padding:calc(46px + env(safe-area-inset-top)) 26px 70px;
  background:linear-gradient(180deg,var(--sky1),var(--sky2));overflow:hidden}
@media (min-width:900px){.hero{margin:28px 0 8px;border-radius:36px;padding-bottom:84px}}
.hero .sun{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#ffd66b 0 55%,rgba(255,214,107,.35) 56% 100%)}
.hero h1{position:relative;margin:0;font-size:clamp(34px,9vw,52px);line-height:1.02;font-weight:850;letter-spacing:-.025em;max-width:11ch;color:#15383f}
.hero p{position:relative;margin:10px 0 0;font-size:17px;max-width:26ch;color:#2c5a60}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h1{color:#e8f4f2}:root:not([data-theme="light"]) .hero p{color:#a9cfd1}}
.hero svg{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:60px;fill:var(--bg)}
.page-head{padding:calc(34px + env(safe-area-inset-top)) 2px 14px}
.page-head h1{margin:0;font-size:32px;font-weight:850;letter-spacing:-.02em}
.page-head p{margin:4px 0 0;color:var(--mute)}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;color:var(--sea);font-weight:800;font-size:15px;background:none;border:0;padding:6px 0;cursor:pointer}

h2.sec{margin:28px 2px 12px;font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:baseline;justify-content:space-between}
h2.sec a{font-size:14px;color:var(--sea);font-weight:700}

/* ---------- início ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-34px;position:relative;z-index:2}
.stat{background:var(--card);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-weight:850;line-height:1.1}
.stat span{font-size:12.5px;color:var(--mute);font-weight:600}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 12px;scroll-snap-type:x proximity;scroll-padding:0 18px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
@media (min-width:900px){.hscroll{margin:0 -32px;padding:2px 32px 12px;scroll-padding:0 32px}}
.daycard{flex:none;width:210px;scroll-snap-align:start;border-radius:22px;padding:16px;color:var(--ink);min-height:150px;display:flex;flex-direction:column}
.daycard .e{font-size:30px;line-height:1}
.daycard small{display:block;margin-top:10px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.daycard b{font-size:18px;font-weight:800;line-height:1.2}
.daycard p{margin:6px 0 0;font-size:13.5px;color:var(--mute);line-height:1.35}
.help{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.help .e{font-size:26px}
.help .tx{flex:1;min-width:0}
.help .tx b{display:block;font-weight:800}
.help .tx span{font-size:13px;color:var(--mute)}
.pill{display:inline-block;border:0;border-radius:99px;padding:9px 16px;background:var(--coral);color:#fff;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.pill.ghost{background:var(--foam);color:var(--sea)}
.crew{display:flex;align-items:center;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);gap:14px}
.crew .av{margin-left:-10px;border:3px solid var(--card)}
.crew .av:first-child{margin-left:0}
.crew .tx{margin-left:auto;text-align:right;font-weight:800}
.crew .tx span{display:block;font-weight:600;font-size:12.5px;color:var(--mute)}

/* ---------- roteiro ---------- */
.timeline{position:relative;padding-left:4px}
.day{position:relative;background:var(--card);border-radius:24px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.day .top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.day .badge{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:26px}
.day small{display:block;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.day h3{margin:0;font-size:21px;font-weight:850;letter-spacing:-.01em}
.meal{display:flex;gap:12px;padding:9px 0;border-top:1px dashed var(--line)}
.meal i{font-style:normal;font-size:20px;width:26px;text-align:center}
.meal div{flex:1}
.meal small{display:block;color:var(--mute);font-weight:700;font-size:12px}
.meal.main span{font-weight:700}
.daynote{margin-top:6px;padding:10px 12px;background:var(--sun-soft);border-radius:14px;font-size:13.5px}

/* ---------- compras ---------- */
.search{width:100%;padding:14px 18px;border:2px solid var(--line);border-radius:18px;background:var(--card);font-size:16px;margin:2px 0 16px}
.search:focus{outline:none;border-color:var(--sea)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{border:0;border-radius:24px;padding:16px;text-align:left;cursor:pointer;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .e{font-size:34px;line-height:1}
.tile b{display:block;font-weight:800;font-size:16px;line-height:1.2}
.tile span{font-size:13px;color:var(--mute);font-weight:600}
.items{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.it{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.it .r{display:flex;align-items:baseline;gap:10px}
.it .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.it .qt{flex:none;max-width:45%;text-align:right;font-weight:800;color:var(--sea);font-size:15px}
.it .nt{margin:3px 0 0;font-size:13px;color:var(--mute);line-height:1.35}
.it .acts{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}
.it.open .acts{display:flex}
.it.open{background:var(--foam)}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800;vertical-align:1px}
.tag.add{background:var(--sun-soft);color:#a96a00}
.tag.opt{background:var(--coral-soft);color:var(--coral)}
.from{padding:12px 16px 4px;font-weight:800;font-size:13px;color:var(--mute)}

/* ---------- casa e gente ---------- */
.rooms{display:grid;gap:12px}
@media (min-width:700px){.rooms{grid-template-columns:1fr 1fr}}
.room{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.room .hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.room .hd .b{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px}
.room h3{margin:0;font-size:18px;font-weight:850}
.room small{color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--bg);font-weight:700;font-size:14px}
.chip .av{width:26px;height:26px;font-size:11px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:850;font-size:14px;color:#15383f}
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.people{grid-template-columns:repeat(3,1fr)}}
.pc{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.pc b{display:block;font-weight:800;line-height:1.15}
.pc span{display:block;margin-top:1px;font-size:12.5px;line-height:1.25;color:var(--mute);font-weight:600}
.aviso{margin:0 0 16px;padding:14px 16px;background:var(--sun-soft);border:2px dashed var(--sun);border-radius:20px;font-size:14.5px;line-height:1.4}
.aviso b{display:block;margin-bottom:2px;font-size:15px}
.cnt{display:flex;gap:8px;flex-wrap:wrap}
.cnt .n{display:inline-flex;align-items:baseline;gap:6px;padding:8px 14px;border-radius:14px;background:var(--foam);font-weight:700;font-size:14px;color:var(--mute)}
.cnt .n b{font-size:22px;font-weight:850;color:var(--ink)}
.cnt .n.k{background:var(--sun-soft)}
.rn{margin:10px 2px 0;font-size:13px;color:var(--mute)}
.warnbox{background:var(--sun-soft);border-radius:20px;padding:14px 16px}
.secret{margin:0 0 16px;padding:16px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.secret.open{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.secret b{font-size:16px}.secret span{font-size:14px;color:var(--mute)}
.revform{display:flex;gap:8px;margin-top:6px}
.revform input{flex:1;min-width:0;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);font-size:16px}
.revform input:focus{outline:none;border-color:var(--sea)}
.secret .err{min-height:0;font-size:13.5px;font-weight:700;color:var(--coral)}
.chips.reveal{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.warnbox{margin-top:14px}.warnbox b{display:block;margin-bottom:4px}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
</style>
</head>
<body>

<div id="lock">
  <form id="lf" autocomplete="off">
    <div class="sun">🌴</div>
    <h1>Feriado na praia</h1>
    <p>Digite a senha para entrar.</p>
    <input id="pw" type="password" placeholder="senha" autocomplete="off" spellcheck="false" autofocus aria-label="Senha">
    <button class="go" id="go" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <nav id="nav" aria-label="Seções"></nav>
  <div id="view"></div>
</div>

    ev.preventDefault();
    const pw = $('pw').value; if (!pw) return;
    $('go').disabled = true; $('err').textContent = 'Abrindo…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(E.salt), iterations: E.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      D = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(E.iv) }, key, un(E.ct))));
    } catch (e) { $('err').textContent = 'Senha incorreta.'; $('go').disabled = false; $('pw').select(); return; }
    $('pw').value = ''; $('lock').hidden = true; $('app').hidden = false; start();
  });

  // ---------- roteamento ----------
  function start() {
    document.title = D.titulo;
    const nav = $('nav');
    TABS.forEach(([id, nome]) => { const a = h('a'); a.href = '#/' + id; a.dataset.id = id; a.innerHTML = ICON[id]; a.append(h('span', null, nome)); nav.append(a); });
    window.addEventListener('hashchange', route); route();
  }
  function route() {
    const [tab, arg] = (location.hash || '#/inicio').slice(2).split('/');
    const t = VIEWS[tab] ? tab : 'inicio';
    document.querySelectorAll('#nav a').forEach(a => { if (a.dataset.id === t) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    $('view').replaceChildren(VIEWS[t](arg)); window.scrollTo(0, 0);
  }

  // ---------- telas ----------
  // ---------- nomes escondidos (brincadeira) ----------
  let REV = null;
  const refresh = () => { const y = window.scrollY; route(); window.scrollTo(0, y); };
  function cardRevelar() {
    const msg = h('div', 'err');
    const inp = h('input'); inp.type = 'password'; inp.placeholder = 'senha secreta'; inp.autocomplete = 'off'; inp.setAttribute('aria-label', 'Senha secreta');
    const btn = h('button', 'pill', 'Revelar'); btn.type = 'submit';
    const f = h('form', 'revform', inp, btn); f.autocomplete = 'off';
    f.addEventListener('submit', async ev => {
      ev.preventDefault(); if (!inp.value) return; btn.disabled = true; msg.textContent = '';
      try {
        const b = D.revelar;
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(inp.value), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(b.salt), iterations: b.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        REV = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(b.iv) }, key, un(b.ct))));
        refresh();
      } catch (e) { msg.textContent = 'Senha errada 🙈 Dica: quem manda na família.'; btn.disabled = false; inp.select(); }
    });
    return h('div', 'secret', h('b', null, '🎁 Quer saber quem fica onde?'), h('span', null, 'Tem uma senha secreta para ver os nomes.'), f, msg);
  }
  function cardEscondido() {
    const b = h('button', 'pill ghost', 'Esconder de novo'); b.type = 'button';
    b.onclick = () => { REV = null; refresh(); };
    return h('div', 'secret open', h('b', null, '🔓 Nomes revelados'), b);
  }

  const VIEWS = {};

  VIEWS.inicio = () => {
    const wrap = h('div');
    const hero = h('div', 'hero', h('div', 'sun'), h('h1', null, D.titulo), h('p', null, D.sub));
    hero.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 30 C50 8 100 8 150 30 S250 52 300 30 S370 10 400 26 V60 H0Z"/></svg>');
    const adultos = D.gente.filter(g => g.tipo === 'adulto').length, criancas = D.gente.length - adultos;
    const stats = h('div', 'stats',
      h('div', 'stat', h('b', null, String(D.gente.length)), h('span', null, 'pessoas')),
      h('div', 'stat', h('b', null, String(D.roteiro.length)), h('span', null, 'dias de praia')),
      h('div', 'stat', h('b', null, String(D.itens_total)), h('span', null, 'itens na lista')));
    wrap.append(hero, stats);

    const rs = h('h2', 'sec', 'Roteiro'); const rl = h('a'); rl.href = '#/roteiro'; rl.textContent = 'ver tudo'; rs.append(rl);
    const hs = h('div', 'hscroll');
    D.roteiro.forEach((d, i) => {
      const c = h('a', 'daycard', h('span', 'e', d.emoji), h('small', null, d.dia), h('b', null, d.titulo), h('p', null, d.almojanta || ''));
      c.href = '#/roteiro'; c.style.background = TINT[i % TINT.length]; hs.append(c);
    });
    wrap.append(rs, hs);

    const leva = D.secoes.filter(s => s.leva).flatMap(s => s.itens);
    if (leva.length) {
      wrap.append(h('h2', 'sec', 'Preciso de voluntário'));
      leva.forEach(it => {
        const b = zap(`Eu levo: ${it.nome}`); b.textContent = 'Eu levo';
        wrap.append(h('div', 'help', h('span', 'e', '🙋'), h('div', 'tx', h('b', null, it.nome), h('span', null, it.nota || 'Quem tiver, leva.')), b));
      });
    }

    const gl = h('a'); gl.href = '#/gente'; gl.textContent = 'ver todos';
    wrap.append(h('h2', 'sec', 'Quem vem', gl));
    const crew = h('div', 'crew'); D.gente.slice(0, 7).forEach(g => crew.append(avatar(g.nome)));
    crew.append(h('div', 'tx', `${D.gente.length} pessoas`, h('span', null, 'adultos e crianças')));
    wrap.append(crew);
    return wrap;
  };

  VIEWS.roteiro = () => {
    const wrap = h('div', null, h('div', 'page-head', h('h1', null, 'Roteiro'), h('p', null, 'O que vamos comer em cada dia. É uma sugestão para a gente ajustar.')));
    const tl = h('div', 'timeline');
    D.roteiro.forEach((d, i) => {
      const badge = h('div', 'badge', d.emoji); badge.style.background = TINT[i % TINT.length];
      const day = h('div', 'day', h('div', 'top', badge, h('div', null, h('small', null, d.dia), h('h3', null, d.titulo))));
      [['cafe', '☕', 'Café da manhã'], ['almojanta', '🍽️', 'Almojanta'], ['lanche', '🍉', 'Lanche']].forEach(([k, e, l]) => {
        if (d[k]) day.append(h('div', 'meal' + (k === 'almojanta' ? ' main' : ''), h('i', null, e), h('div', null, h('small', null, l), h('span', null, d[k]))));
      });
      if (d.nota) day.append(h('div', 'daynote', '💡 ' + d.nota));
      tl.append(day);
    });
    wrap.append(tl); return wrap;
  };

  function linha(it, secEmoji) {
    const row = h('div', 'it');
    const nm = h('span', 'nm', it.nome);
    if (it.tipo === 'add') nm.append(h('span', 'tag add', 'novo'));
    if (it.tipo === 'opt') nm.append(h('span', 'tag opt', 'decidir lá'));
    row.append(h('div', 'r', secEmoji ? h('span', null, secEmoji) : null, nm, it.qtd ? h('span', 'qt', it.qtd) : null));
    if (it.nota) row.append(h('p', 'nt', it.nota));
    const sug = zap(`Sobre "${it.nome}"${it.qtd ? ' (' + it.qtd + ')' : ''} na lista do feriado: `); sug.className = 'pill ghost'; sug.textContent = '💬 Sugerir mudança';
    const lev = zap(`Eu levo: ${it.nome}`); lev.textContent = '🙋 Eu levo';
    row.append(h('div', 'acts', lev, sug));
    row.addEventListener('click', e => { if (e.target.closest('a')) return; row.classList.toggle('open'); });
    return row;
  }

  VIEWS.compras = arg => {
    const wrap = h('div');
    if (arg !== undefined && D.secoes[+arg]) {
      const s = D.secoes[+arg];
      const back = h('button', 'back', '← Compras'); back.onclick = () => { location.hash = '#/compras'; };
      wrap.append(h('div', 'page-head', back, h('h1', null, `${s.emoji} ${s.nome}`), h('p', null, plural(s.itens.length, 'item', 'itens') + '. Toque num item para sugerir mudança ou dizer que leva.')));
      const box = h('div', 'items'); s.itens.forEach(it => box.append(linha(it))); wrap.append(box); return wrap;
    }
    wrap.append(h('div', 'page-head', h('h1', null, 'Compras'), h('p', null, 'Tudo o que vamos levar para o feriado, para todo mundo saber.')));
    const q = h('input', 'search'); q.type = 'search'; q.placeholder = '🔎  Buscar item (ex.: carvão)'; q.setAttribute('aria-label', 'Buscar item');
    const out = h('div'); wrap.append(q, out);
    const tiles = () => {
      const g = h('div', 'grid');
      D.secoes.forEach((s, i) => {
        const t = h('button', 'tile', h('span', 'e', s.emoji), h('div', null, h('b', null, s.nome), h('span', null, plural(s.itens.length, 'item', 'itens'))));
        t.style.background = TINT[i % TINT.length]; t.onclick = () => { location.hash = '#/compras/' + i; }; g.append(t);
      });
      return g;
    };
    const draw = () => {
      const v = norm(q.value.trim()); out.replaceChildren();
      if (!v) { out.append(tiles()); return; }
      const box = h('div', 'items'); let n = 0;
      D.secoes.forEach(s => s.itens.forEach(it => { if (norm(it.nome + ' ' + (it.nota || '')).includes(v)) { box.append(linha(it, s.emoji)); n++; } }));
      out.append(n ? box : h('div', 'empty', 'Nenhum item com esse nome.'));
    };
    q.addEventListener('input', draw); draw(); return wrap;
  };

  VIEWS.casa = () => {
    const wrap = h('div', null, h('div', 'page-head', h('h1', null, 'Casa'), h('p', null, 'Uma ideia de quanta gente em cada lugar.')));
    if (D.aviso_casa) wrap.append(h('div', 'aviso', h('b', null, '💡 Só uma sugestão'), D.aviso_casa));
    if (D.revelar) wrap.append(REV ? cardEscondido() : cardRevelar());
    const rooms = h('div', 'rooms'); let ad = 0, cr = 0;
    const conta = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
    D.casa.forEach((q, i) => {
      ad += q.adultos; cr += q.criancas;
      const b = h('div', 'b', q.emoji); b.style.background = TINT[i % TINT.length];
      const cnt = h('div', 'cnt');
      if (q.adultos) cnt.append(h('span', 'n', h('b', null, String(q.adultos)), q.adultos === 1 ? 'adulto' : 'adultos'));
      if (q.criancas) cnt.append(h('span', 'n k', h('b', null, String(q.criancas)), q.criancas === 1 ? 'criança' : 'crianças'));
      if (!q.adultos && !q.criancas) cnt.append(h('span', 'n', 'livre'));
      const card = h('div', 'room', h('div', 'hd', b, h('div', null, h('h3', null, q.nome), h('small', null, q.desc))), cnt);
      if (REV && REV[i]) { const chips = h('div', 'chips reveal'); REV[i].forEach(n => chips.append(h('span', 'chip', avatar(n), n))); card.append(chips); }
      if (q.nota) card.append(h('p', 'rn', q.nota));
      rooms.append(card);
    });
    wrap.append(rooms);
    const totA = D.gente.filter(g => g.tipo === 'adulto').length, totC = D.gente.length - totA;
    const fa = totA - ad, fc = totC - cr;
    if (fa > 0 || fc > 0) {
      const partes = [fa > 0 ? conta(fa, 'adulto', 'adultos') : null, fc > 0 ? conta(fc, 'criança', 'crianças') : null].filter(Boolean).join(' + ');
      wrap.append(h('div', 'warnbox', h('b', null, 'Faltam encaixar: ' + partes), 'Ainda não cabem nos lugares da sugestão acima.'));
    }
    return wrap;
  };

  VIEWS.gente = () => {
    const wrap = h('div', null, h('div', 'page-head', h('h1', null, 'Gente'), h('p', null, `${D.gente.length} pessoas no feriado.`)));
    [['adulto', 'Adultos'], ['crianca', 'Crianças']].forEach(([t, nome]) => {
      const l = D.gente.filter(g => g.tipo === t); if (!l.length) return;
      const g = h('div', 'people'); l.forEach(p => g.append(h('div', 'pc', avatar(p.nome), h('div', null, h('b', null, p.nome), p.nota ? h('span', null, p.nota) : null))));
      wrap.append(h('h2', 'sec', `${nome} (${l.length})`), g);
    });
    return wrap;
  };
})();
</script>
</body>
</html>
